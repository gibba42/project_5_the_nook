<li class="list-inline-item dropdown">

    <!-- Mobile search button -->
    <a
        class="nook-header-link nav-link d-block d-lg-none"
        href="#"
        id="mobile-search"
        data-bs-toggle="dropdown"
        aria-expanded="false">

        <div class="text-center">

            <div>
                <i
                    class="fa-solid fa-magnifying-glass fa-lg"
                    aria-hidden="true">
                </i>
            </div>

            <p class="my-0">
                Search
            </p>

        </div>

    </a>

    <!-- Mobile search form -->
    <div
        class="dropdown-menu border-0 p-3 rounded-0 my-0 mobile-search-dropdown"
        aria-labelledby="mobile-search">

        <form
            method="GET"
            action="{% url 'book_list' %}"
            role="search">

            <div class="input-group w-100">

                <input
                    class="form-control"
                    type="search"
                    name="q"
                    placeholder="Search books or authors"
                    aria-label="Search books">

                <button
                    class="btn nook-search-button"
                    type="submit"
                    aria-label="Submit search">

                    <span class="icon">
                        <i
                            class="fa-solid fa-magnifying-glass"
                            aria-hidden="true">
                        </i>
                    </span>

                </button>

            </div>

        </form>

    </div>

</li>


<li class="list-inline-item dropdown">

    <!-- Mobile account button -->
    <a
        class="nook-header-link nav-link d-block d-lg-none"
        href="#"
        id="mobile-user-options"
        data-bs-toggle="dropdown"
        aria-expanded="false">

        <div class="text-center">

            <div>
                <i
                    class="fa-regular fa-user fa-lg"
                    aria-hidden="true">
                </i>
            </div>

            <p class="my-0">
                My Account
            </p>

        </div>

    </a>

    <!-- Mobile account dropdown -->
    <div
        class="dropdown-menu dropdown-menu-end border-0"
        aria-labelledby="mobile-user-options">

        {% if request.user.is_authenticated %}

            <!-- Available to every authenticated user -->
            <a
                href="{% url 'author_dashboard' %}"
                class="dropdown-item">
                Author Dashboard
            </a>

            <!-- Available only to staff -->
            {% if request.user.is_staff %}

                <a
                    href="{% url 'approval_dashboard' %}"
                    class="dropdown-item">
                    Book Approvals
                </a>

            {% endif %}

            <a
                href="{% url 'profile' %}"
                class="dropdown-item">
                My Profile
            </a>

            <a
                href="{% url 'account_logout' %}"
                class="dropdown-item">
                Logout
            </a>

        {% else %}

            <a
                href="{% url 'account_signup' %}"
                class="dropdown-item">
                Register
            </a>

            <a
                href="{% url 'account_login' %}"
                class="dropdown-item">
                Login
            </a>

        {% endif %}

    </div>

</li>


<li class="list-inline-item">

    <!-- Mobile basket -->
    <a
        class="
        {% if grand_total %}
            nook-basket-active
        {% else %}
            nook-header-link
        {% endif %}
        nav-link d-block d-lg-none"
        href="{% url 'view_bag' %}">

        <div class="text-center">

            <div>
                <i
                    class="fa-solid fa-bag-shopping fa-lg"
                    aria-hidden="true">
                </i>
            </div>

            <p class="my-0">

                {% if total %}
                    £{{ total|floatformat:2 }}
                {% else %}
                    £0.00
                {% endif %}

            </p>

        </div>

    </a>

</li>
