{% with current_url=request.resolver_match.url_name %}
<div class="collapse navbar-collapse" id="main-nav">

    <ul class="navbar-nav w-auto mx-auto nook-main-nav">

        <!-- Home -->
        <li class="nav-item">
            <a
                class="nav-link{% if current_url == 'home' %} active{% endif %}"
                href="{% url 'home' %}"
                {% if current_url == 'home' %}
                    aria-current="page"
                {% endif %}>
                Home
            </a>
        </li>

        <!-- Books -->
        <li class="nav-item">
            <a
                class="nav-link{% if current_url == 'book_list' or current_url == 'book_detail' %} active{% endif %}"
                href="{% url 'book_list' %}"
                {% if current_url == 'book_list' or current_url == 'book_detail' %}
                    aria-current="page"
                {% endif %}>
                Books
            </a>
        </li>

        <!-- Genres -->
        <li class="nav-item">
            <a
                class="nav-link"
                href="{% url 'book_list' %}#catalogue-filters">
                Genres
            </a>
        </li>

        <!-- New Releases -->
        <li class="nav-item">
            <a
                class="nav-link"
                href="{% url 'book_list' %}?sort=newest">
                New Releases
            </a>
        </li>

        <!-- Newsletter -->
        <li class="nav-item">
            <a
                class="nav-link"
                href="{% url 'home' %}#newsletter">
                Newsletter
            </a>
        </li>

    </ul>

</div>
{% endwith %}
